
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NE-LogiSmart</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <a href="{% url 'home' %}" class="auth-brand">
                <span class="brand-icon">N</span>
                NE-LogiSmart
            </a>

            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Login to your NE-LogiSmart account</p>

            <form method="POST">
                {% csrf_token %}

                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button type="button"
                                class="password-toggle"
                                aria-label="Show password">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- Django Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="form-message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <button type="submit" class="auth-button">Login</button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="{% url 'accounts:register' %}">Register</a>
            </p>

        </div>
    </div>

    <!-- Password Show/Hide Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleButton = document.querySelector(".password-toggle");
            const passwordInput = document.querySelector("#password");

            const eyeIcon = `
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>`;

            const eyeOffIcon = `
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a13.5 13.5 0 0 1-3.3 4.1"/>
                    <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4-.8"/>
                </svg>`;

            toggleButton.addEventListener("click", function () {
                const isPassword = passwordInput.type === "password";

                passwordInput.type = isPassword ? "text" : "password";

                toggleButton.innerHTML = isPassword ? eyeOffIcon : eyeIcon;

                toggleButton.setAttribute(
                    "aria-label",
                    isPassword ? "Hide password" : "Show password"
                );
            });
        });
    </script>

</body>
</html>
